# Replace YOUR_DOMAIN or use server IP with HTTP only for testing.

upstream hirelens_api {
    server 127.0.0.1:8000;
}

upstream hirelens_attention {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name api.YOUR_DOMAIN;

    client_max_body_size 50M;

    location / {
        proxy_pass http://hirelens_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://hirelens_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name attention.YOUR_DOMAIN;

    client_max_body_size 50M;

    location / {
        proxy_pass http://hirelens_attention;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
